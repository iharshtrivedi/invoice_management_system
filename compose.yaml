
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - C:\fastapi\secrets\invoice_management_system.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    env_file:
      - C:\fastapi\secrets\invoice_management_system.env
    command: celery -A services.celery_app:celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file:
      - C:\fastapi\secrets\invoice_management_system.env
    command: celery -A services.celery_app:celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
