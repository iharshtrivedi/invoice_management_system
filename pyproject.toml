[project]
name = "inv-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "celery-types>=0.26.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "reportlab>=5.0.1",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
